[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["poker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]