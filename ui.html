<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Sim</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #10251c;
        --surface: #183629;
        --surface-light: #214a37;
        --text: #f5f7f4;
        --muted: #b8c8bd;
        --accent: #e4b84a;
        --danger: #ff9a9a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: radial-gradient(circle at top, #235238, var(--background) 55%);
        color: var(--text);
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
      }

      main {
        margin: 0 auto;
        max-width: 720px;
        padding: 3rem 1.25rem;
      }

      h1 {
        color: var(--accent);
        margin-bottom: 0.4rem;
      }

      .intro,
      .hint {
        color: var(--muted);
      }

      form,
      .result {
        background: rgb(255 255 255 / 100%);
        border: 1px solid #000;
        border-radius: 12px;
        margin-top: 1.5rem;
        padding: 1.25rem;
      }

      .controls,
      .cards {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(2, 1fr);
      }

      .cards {
        margin-top: 1rem;
      }

      fieldset {
        border: 1px solid #46785b;
        border-radius: 8px;
        min-width: 0;
        padding: 1rem;
      }

      legend {
        color: var(--accent);
        font-weight: 700;
        padding: 0 0.4rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin: 0.75rem 0 0.35rem;
      }

      select,
      button {
        border: 0;
        border-radius: 6px;
        font: inherit;
        padding: 0.7rem;
        width: 100%;
      }

      select {
        background: var(--text);
        color: #16231b;
      }

      button {
        background: var(--accent);
        color: #1d271d;
        cursor: pointer;
        font-weight: 700;
        margin-top: 1.25rem;
      }

      button:hover {
        filter: brightness(1.08);
      }

      .error {
        color: var(--danger);
        min-height: 1.5rem;
      }

      .result h2 {
        color: var(--accent);
        margin-top: 0;
      }

      .hand-name {
        font-size: 1.5rem;
        font-weight: 700;
      }

      @media (max-width: 520px) {
        .controls,
        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Poker Hand Evaluator</h1>
      <p class="intro">
        Choose two cards to classify a starting Texas Hold'em hand.
      </p>

      <form id="hand-form">
        <div class="controls">
          <div>
            <label for="players">Players</label>
            <select id="players" name="players">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>
        </div>

        <div class="cards">
          <fieldset>
            <legend>First card</legend>
            <label for="rank1">Rank</label>
            <select id="rank1" name="rank1"></select>
            <label for="suit1">Suit</label>
            <select id="suit1" name="suit1"></select>
          </fieldset>

          <fieldset>
            <legend>Second card</legend>
            <label for="rank2">Rank</label>
            <select id="rank2" name="rank2"></select>
            <label for="suit2">Suit</label>
            <select id="suit2" name="suit2"></select>
          </fieldset>
        </div>

        <p id="error-message" class="error" role="alert"></p>
        <button type="submit">Evaluate hand</button>
      </form>

      <section class="result" aria-live="polite">
        <h2>Result</h2>
        <p id="hand-name" class="hand-name">Choose two cards to begin.</p>
        <p id="hand-code"></p>
        <p class="hint">
          This page is currently a standalone UI. Later, connect the form to
          your Python evaluator with Flask.
        </p>
      </section>
    </main>

    <script>
      const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
      const suits = [
        { value: "s", label: "Spades", symbol: "♠" },
        { value: "h", label: "Hearts", symbol: "♥" },
        { value: "d", label: "Diamonds", symbol: "♦" },
        { value: "c", label: "Clubs", symbol: "♣" }
      ];

      function fillSelect(selectId, options) {
        const select = document.getElementById(selectId);
        options.forEach((option) => {
          const element = document.createElement("option");
          element.value = option.value ?? option;
          element.textContent = option.label ?? option;
          select.appendChild(element);
        });
      }

      ["rank1", "rank2"].forEach((id) => fillSelect(id, ranks));
      ["suit1", "suit2"].forEach((id) => fillSelect(id, suits));

      function classifyHand(rank1, suit1, rank2, suit2) {
        const firstIndex = ranks.indexOf(rank1);
        const secondIndex = ranks.indexOf(rank2);
        const highIndex = Math.min(firstIndex, secondIndex);
        const lowIndex = Math.max(firstIndex, secondIndex);
        const highRank = ranks[highIndex];
        const lowRank = ranks[lowIndex];
        const pair = highIndex === lowIndex;
        const suited = suit1 === suit2;
        const gap = lowIndex - highIndex - 1;
        const code = pair ? `${highRank}${lowRank}` :
          `${highRank}${lowRank}${suited ? "s" : "o"}`;

        if (pair && highIndex <= ranks.indexOf("J")) return [code, "Premium Pair"];
        if (["AKs", "AKo"].includes(code)) return [code, "Premium Broadway"];
        if (["TT", "99", "AQs", "AQo", "AJs", "KQs"].includes(code)) {
          return [code, "Strong Hand"];
        }
        if (pair) return [code, "Medium Pair"];
        if (suited && highRank === "A" && "23456789".includes(lowRank)) {
          return [code, "Suited Ace"];
        }
        if (suited && gap === 0) return [code, "Suited Connector"];
        if (suited && gap === 1) return [code, "Suited One-Gapper"];
        return [code, "Trash"];
      }

      document.getElementById("hand-form").addEventListener("submit", (event) => {
        event.preventDefault();

        const rank1 = document.getElementById("rank1").value;
        const rank2 = document.getElementById("rank2").value;
        const suit1 = document.getElementById("suit1").value;
        const suit2 = document.getElementById("suit2").value;
        const error = document.getElementById("error-message");

        if (rank1 === rank2 && suit1 === suit2) {
          error.textContent = "You cannot choose the same card twice.";
          return;
        }

        error.textContent = "";
        const [code, classification] = classifyHand(rank1, suit1, rank2, suit2);
        document.getElementById("hand-name").textContent = classification;
        document.getElementById("hand-code").textContent = `Hand: ${code}`;
      });
    </script>
  </body>
</html>
